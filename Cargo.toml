[package]
name = "zone-sequencer-rs"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
logos-blockchain-zone-sdk = { git = "https://github.com/xAlisher/logos-blockchain", rev = "39e29398e8c26e13a57ea6ad80d1a24beb21213f", package = "logos-blockchain-zone-sdk" }
lb-key-management-system-service = { git = "https://github.com/xAlisher/logos-blockchain", rev = "39e29398e8c26e13a57ea6ad80d1a24beb21213f", package = "logos-blockchain-key-management-system-service" }
lb-core = { git = "https://github.com/xAlisher/logos-blockchain", rev = "39e29398e8c26e13a57ea6ad80d1a24beb21213f", package = "logos-blockchain-core" }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
serde_json = "1"
lb-common-http-client = { git = "https://github.com/xAlisher/logos-blockchain", rev = "39e29398e8c26e13a57ea6ad80d1a24beb21213f", package = "logos-blockchain-common-http-client" }
reqwest = { version = "0.12", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
